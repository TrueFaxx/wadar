<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WADAR // SEARCH & RESCUE</title>
<link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
</head>
<body>
<div class="crt">

<div class="landing">
  <!-- ASCII SCENE — full background layer -->
  <div class="scene-bg boot-fade" id="b-art">
    <div class="ascii-scene" id="ascii-scene"></div>
  </div>

  <div class="header boot-fade" id="b-header">
    <div class="title">WADAR</div>
    <div class="subtitle">Search &amp; Rescue Triangulation System</div>
  </div>

  <div class="main">
    <div class="menu-left boot-fade" id="b-menu">
      <a class="menu-item active" href="/wadar">View WADAR</a>
      <a class="menu-item" href="#">Settings</a>
      <a class="menu-item" href="#">Developer Config</a>
    </div>

    <div style="flex:1"></div>

    <div class="panel-right boot-fade" id="b-info">
      <div class="info-panel">
        <div class="info-panel-title">Mission Intel</div>
        <div class="info-row">
          <span class="label">Date</span>
          <span class="value" id="info-date">--</span>
        </div>
        <div class="info-row">
          <span class="label">Time</span>
          <span class="value" id="info-time">--:--:--Z</span>
        </div>
        <div class="info-row">
          <span class="label">Location</span>
          <span class="value" id="info-loc">--</span>
        </div>
        <div class="info-row">
          <span class="label">Coords</span>
          <span class="value">37.6879&deg;N</span>
        </div>
        <div class="info-row">
          <span class="label"></span>
          <span class="value">121.8867&deg;W</span>
        </div>
        <div class="info-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #333;">
          <span class="label">Status</span>
          <span class="value" id="info-status">STANDBY</span>
        </div>
        <div class="info-row">
          <span class="label">Dishes</span>
          <span class="value">2 ONLINE</span>
        </div>
        <div class="info-row">
          <span class="label">Devices</span>
          <span class="value" id="info-devices">--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar boot-fade" id="b-bottom">
    <div>
      <span class="action"><span class="key">ENTER</span> Select</span>
      <span class="action"><span class="key">ESC</span> Back</span>
    </div>
    <div>WADAR v2.1 // ZOHO OFFICE, PLEASANTON CA</div>
  </div>
</div>

</div>

<script>
/* ============================================================
   FOREST SCENE — fills entire viewport with trees
   Canopy at top, trunks below, ground at very bottom.
   Trees grow upward from the bottom — trunks are tall vertical
   strokes, canopy is dense foliage at the top.
   ============================================================ */
var CANOPY_CHARS  = ['{','}','(',')','/','\\','[',']','^','&','%','*','#','@'];
var BRANCH_CHARS  = ['/','\\','|','{','}','(',')','~','^'];
var TRUNK_CHARS   = ['|','!','l','I',':',';','|','|','|'];
var GROUND_CHARS  = ['.','.',',',',','_','_','.','`',"'",'.',','];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function buildScene() {
  var el = document.getElementById('ascii-scene');
  el.innerHTML = '';

  var fontSize = 7;
  var lineHeight = fontSize * 1.05;
  var charWidth = fontSize * 0.6;
  var W = Math.ceil(window.innerWidth / charWidth) + 10;
  var totalRows = Math.ceil(window.innerHeight / lineHeight) + 5;

  // Zone boundaries (from top of screen)
  //  0 .. skyEnd:        mostly empty sky with sparse canopy tips
  //  skyEnd .. canopyEnd: dense canopy
  //  canopyEnd .. trunkEnd: trunks + branches
  //  trunkEnd .. totalRows: ground / roots
  var skyEnd     = Math.floor(totalRows * 0.08);
  var canopyEnd  = Math.floor(totalRows * 0.35);
  var trunkEnd   = Math.floor(totalRows * 0.92);

  for (var r = 0; r < totalRows; r++) {
    var div = document.createElement('div');
    var html = '';

    for (var c = 0; c < W; c++) {
      if (r < skyEnd) {
        // Sky — sparse canopy tips poking up
        var density = (r / skyEnd) * 0.3; // gets denser toward canopyEnd
        if (Math.random() < density) {
          html += '<span class="tree">' + pick(CANOPY_CHARS) + '</span>';
        } else {
          html += ' ';
        }
      } else if (r < canopyEnd) {
        // Dense canopy — thick foliage
        var t = (r - skyEnd) / (canopyEnd - skyEnd); // 0..1 through canopy
        var density = 0.5 + t * 0.4; // 50% to 90% fill
        if (Math.random() < density) {
          html += '<span class="tree">' + pick(CANOPY_CHARS) + '</span>';
        } else {
          html += ' ';
        }
      } else if (r < trunkEnd) {
        // Trunk zone — vertical strokes with occasional branches
        var t = (r - canopyEnd) / (trunkEnd - canopyEnd);
        // Trunks are columns — higher chance if we're on a "trunk column"
        // Create ~15 trunk positions spread across width
        var trunkSpacing = Math.floor(W / 15);
        var nearTrunk = (c % trunkSpacing) < 2;
        var branchChance = nearTrunk ? 0.6 : 0.04;
        // Branches more common near top of trunk zone
        var branchExtra = (1 - t) * 0.08;

        if (nearTrunk && Math.random() < 0.7) {
          html += '<span class="tree">' + pick(TRUNK_CHARS) + '</span>';
        } else if (Math.random() < branchChance + branchExtra) {
          html += '<span class="tree">' + pick(BRANCH_CHARS) + '</span>';
        } else {
          html += ' ';
        }
      } else {
        // Ground — scattered low detail
        if (Math.random() < 0.4) {
          html += '<span class="tree">' + pick(GROUND_CHARS) + '</span>';
        } else {
          html += ' ';
        }
      }
    }

    div.innerHTML = html;
    el.appendChild(div);
  }
}

buildScene();

/* Clock */
function updateInfo() {
  var now = new Date();
  var h = String(now.getUTCHours()).padStart(2, '0');
  var m = String(now.getUTCMinutes()).padStart(2, '0');
  var s = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('info-time').textContent = h + ':' + m + ':' + s + 'Z';

  var days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('info-date').textContent =
    days[now.getUTCDay()] + ' ' +
    String(now.getUTCDate()).padStart(2,'0') + ' ' +
    months[now.getUTCMonth()] + ' ' +
    now.getUTCFullYear();

  document.getElementById('info-loc').textContent = 'PLEASANTON, CA';
}

/* Boot */
var bootOrder = ['b-art', 'b-header', 'b-menu', 'b-info', 'b-bottom'];
var bootDelay = 200;

document.fonts.ready.then(function() {
  bootOrder.forEach(function(id, i) {
    setTimeout(function() {
      document.getElementById(id).classList.add('visible');
    }, i * bootDelay);
  });

  setTimeout(function() {
    updateInfo();
    setInterval(updateInfo, 1000);
    document.getElementById('info-status').textContent = 'OPERATIONAL';
    document.getElementById('info-devices').textContent = '3 DETECTED';
  }, bootOrder.length * bootDelay + 200);
});

/* Keyboard navigation */
var menuItems = document.querySelectorAll('.menu-item');
var menuIdx = 0;

function setActiveMenu(idx) {
  menuItems.forEach(function(item) { item.classList.remove('active'); });
  menuIdx = idx;
  menuItems[menuIdx].classList.add('active');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setActiveMenu(Math.min(menuIdx + 1, menuItems.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setActiveMenu(Math.max(menuIdx - 1, 0));
  } else if (e.key === 'Enter') {
    menuItems[menuIdx].click();
  }
});

</script>
</body>
</html>
