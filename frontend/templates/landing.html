<script>
/* ============================================================
   FOREST SCENE — individual pine trees placed across viewport
   Each tree is a triangle of foliage on a thick trunk.
   ============================================================ */
var FIRE_CHARS     = ['^','*','~','"',"'",'`','.'];
var FIRE_COLORS    = ['fc0','fc1','fc2','fc3','fc4'];
var NEEDLE_CHARS   = ['{','}','(',')','/','\\','^','*','%','&','#'];
var NEEDLE_CLASSES = ['n0','n1','n2','n3','n4','n5'];
var TRUNK_CHARS    = ['|','H','#','|','|','|','I','|'];
var TRUNK_CLASSES  = ['t0','t1','t2','t3','t4'];
var GROUND_CHARS   = ['.','.',',',',','_','.','`',"'"];
var SKY_CHARS    = ['.','.',':',':','-','~','`',"'",' ',' ',' '];
var SKY_DENSE    = ['.',':',';','-','~','=','+','*'];
var SKY_CLASSES  = ['sky0','sky1','sky2','sky3','sky4','sky5','sky6','sky7','sky8','sky9','sky10','sky11','sky12','sky13','sky14'];
var CHAR_DENSE   = ['@','#','M','W','N','%','&','$','8','B','D'];
var CHAR_MED     = ['=','+','*','x','o','k','d'];
var CHAR_LIGHT   = [':',';','.','~','-'];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function skyClass(row, totalRows) {
  var t = row / totalRows;
  var idx = Math.floor(t * SKY_CLASSES.length);
  if (idx >= SKY_CLASSES.length) idx = SKY_CLASSES.length - 1;
  return SKY_CLASSES[idx];
}

/* ============================================================
   FIREFIGHTER CHARACTER — 3 shapes: helmet, head, body
   All defined as ellipses with center, radii, and row range.
   Painted onto grid after trees. Body extends off-screen bottom.
   ============================================================ */
function paintEllipse(grid, cx, cy, rx, ry, val, W, totalRows, edgeFade) {
  for (var r = cy - ry; r <= cy + ry; r++) {
    if (r < 0 || r >= totalRows) continue;
    var dy = (r - cy) / ry;
    var xExt = Math.floor(rx * Math.sqrt(Math.max(0, 1 - dy * dy)));
    for (var dc = -xExt; dc <= xExt; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        if (edgeFade) {
          var ed = Math.abs(dc) / (xExt || 1);
          if (ed > 0.93 && Math.random() > 0.5) continue;
        }
        grid[r][col] = val;
      }
    }
  }
}

function buildCharacter(W, totalRows, grid) {
  var cx = Math.floor(W / 2);

  // Key positions
  var headCY = Math.floor(totalRows * 0.42);
  var headRX = 28;
  var headRY = 22;
  var bodyTopRow = Math.floor(totalRows * 0.58);
  var helmetCY = headCY - headRY + 6;
  var helmetRX = 36;
  var helmetRY = 10;

  // === 1. BODY — turnout coat (painted first, bottom layer) ===
  var bodyNeckW = 18;
  var bodyShoulderW = 65;
  var bodyWidenRows = 25;
  // Reflective stripe rows (relative to bodyTopRow)
  var stripe1 = 10;
  var stripe2 = 22;

  for (var r = bodyTopRow; r < totalRows; r++) {
    var rowInBody = r - bodyTopRow;
    var t = Math.min(rowInBody / bodyWidenRows, 1);
    var ease = 1 - (1 - t) * (1 - t);
    var halfW = Math.floor(bodyNeckW + (bodyShoulderW - bodyNeckW) * ease);

    // Determine what part of coat this row is
    var isStripe = (rowInBody >= stripe1 && rowInBody < stripe1 + 2) ||
                   (rowInBody >= stripe2 && rowInBody < stripe2 + 2);

    for (var dc = -halfW; dc <= halfW; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        var edgeDist = Math.abs(dc) / halfW;
        if (edgeDist > 0.95 && Math.random() > 0.6) continue;

        if (isStripe) {
          grid[r][col] = 'S'; // reflective stripe
        } else {
          grid[r][col] = 'K'; // coat
        }
      }
    }
  }

  // === 2. NECK — shadowed skin ===
  var neckTop = headCY + headRY - 3;
  var neckBot = bodyTopRow + 2;
  var neckHalfW = 12;
  for (var r = neckTop; r <= neckBot; r++) {
    if (r < 0 || r >= totalRows) continue;
    for (var dc = -neckHalfW; dc <= neckHalfW; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'n'; // neck
      }
    }
  }

  // === 4. HEAD — face/skin ===
  paintEllipse(grid, cx, headCY, headRX, headRY, 'F', W, totalRows, true);

  // === 5. HELMET — dark red, on top of everything ===
  // Main dome
  for (var r = helmetCY - helmetRY; r <= helmetCY + helmetRY; r++) {
    if (r < 0 || r >= totalRows) continue;
    var dy = (r - helmetCY) / helmetRY;
    var xExt = Math.floor(helmetRX * Math.sqrt(Math.max(0, 1 - dy * dy)));
    if (dy > 0) xExt = Math.floor(xExt * 1.15);

    for (var dc = -xExt; dc <= xExt; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'H'; // helmet
      }
    }
  }

  // Brim — wider, darker band
  var brimRow = helmetCY + helmetRY - 2;
  var brimHalfW = Math.floor(helmetRX * 1.2);
  for (var dr = 0; dr < 3; dr++) {
    var r = brimRow + dr;
    if (r < 0 || r >= totalRows) continue;
    var w = brimHalfW - dr * 3;
    for (var dc = -w; dc <= w; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'B'; // brim
      }
    }
  }

  // Visor band
  var visorRow = helmetCY + 2;
  var visorHalfW = Math.floor(helmetRX * 0.7);
  for (var dr = 0; dr < 2; dr++) {
    var r = visorRow + dr;
    if (r >= 0 && r < totalRows) {
      for (var dc = -visorHalfW; dc <= visorHalfW; dc++) {
        var col = cx + dc;
        if (col >= 0 && col < W) {
          grid[r][col] = 'V'; // visor
        }
      }
    }
  }

  // === 6. HELMET LIGHT — large bright block centered on helmet ===
  var lightCY = helmetCY - 1;
  var lightHalfW = 6;
  var lightHalfH = 3;
  for (var dr = -lightHalfH; dr <= lightHalfH; dr++) {
    var r = lightCY + dr;
    if (r < 0 || r >= totalRows) continue;
    var w = lightHalfW - Math.abs(dr);
    if (w < 3) w = 3;
    for (var dc = -w; dc <= w; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'L'; // light
      }
    }
  }

}

function buildScene() {
  var el = document.getElementById('ascii-scene');
  el.innerHTML = '';

  var fontSize = 7;
  var lineHeight = fontSize * 1.05;
  var charWidth = fontSize * 0.6;
  var W = Math.ceil(window.innerWidth / charWidth) + 10;
  var totalRows = Math.ceil(window.innerHeight / lineHeight) + 5;

  // Generate individual trees with varied sizes and positions
  // Each tree: { x: center col, topRow: where tip starts, height: total rows, trunkWidth: 2-4 }
  var trees = [];
  var numTrees = Math.floor(W / 8) + 5;
  for (var i = 0; i < numTrees; i++) {
    var x = Math.floor(Math.random() * W);
    // Vary tree height — taller trees reach higher on screen
    var h = Math.floor(Math.random() * 38) + 30; // 30-68 rows tall
    var canopyH = Math.floor(h * 0.7);
    var trunkH = h - canopyH;
    var trunkW = Math.floor(Math.random() * 2) + 3; // 3-5 chars wide
    // Bottom of tree sits in the lower portion of the screen
    var bottomRow = totalRows - Math.floor(Math.random() * 6) - 2;
    var topRow = bottomRow - h;
    // Max canopy width at base of canopy (widest point)
    var maxCanopyW = Math.floor(canopyH * 0.8) + 5;

    trees.push({
      x: x,
      topRow: topRow,
      canopyH: canopyH,
      trunkH: trunkH,
      trunkW: trunkW,
      maxCanopyW: maxCanopyW,
      bottomRow: bottomRow
    });
  }

  trees.sort(function(a, b) { return a.topRow - b.topRow; });

  // Build full grid first so character can overlay trees
  var grid = [];
  for (var r = 0; r < totalRows; r++) {
    grid[r] = new Array(W);
    for (var c = 0; c < W; c++) grid[r][c] = null;
  }

  // Paint trees onto grid
  for (var r = 0; r < totalRows; r++) {
    for (var ti = 0; ti < trees.length; ti++) {
      var t = trees[ti];
      if (r < t.topRow || r > t.bottomRow) continue;

      var rowInTree = r - t.topRow;

      if (rowInTree < t.canopyH) {
        var progress = rowInTree / t.canopyH;
        var layerWave = Math.sin(rowInTree * 1.2) * 1.5;
        var halfW = Math.floor((progress * t.maxCanopyW) / 2 + layerWave);
        if (halfW < 1) halfW = 1;

        // Top 3 rows of each tree = fire tip
        var isTip = rowInTree < 3;

        for (var dc = -halfW; dc <= halfW; dc++) {
          var col = t.x + dc;
          if (col >= 0 && col < W) {
            var edgeDist = halfW > 0 ? Math.abs(dc) / halfW : 0;
            var density = 0.9 - edgeDist * 0.5;
            if (Math.random() < density) {
              grid[r][col] = isTip ? 'f' : 'N';
            }
          }
        }
      } else {
        // Trunk zone — thick vertical trunk
        var halfT = Math.floor(t.trunkW / 2);
        for (var dc = -halfT; dc <= halfT; dc++) {
          var col = t.x + dc;
          if (col >= 0 && col < W) {
            grid[r][col] = 'T'; // trunk
          }
        }
      }
    }

  } // end tree row loop

  // Paint firefighter character on top of trees
  buildCharacter(W, totalRows, grid);

  // Render grid to HTML
  for (var r = 0; r < totalRows; r++) {
    var div = document.createElement('div');
    var isGround = r >= totalRows - 6;
    var cls = isGround ? 'gnd' : skyClass(r, totalRows);

    var html = '';
    var c = 0;
    while (c < W) {
      var ch = grid[r][c];
      var HELM_CLS = ['helm0','helm1','helm2','helm3'];
      var BRIM_CLS = ['brim0','brim1'];
      var FACE_CLS = ['face0','face1','face2'];
      var COAT_CLS = ['coat0','coat1','coat2','coat3'];
      var GEAR_CLS = ['gear0','gear1'];

      if (ch === 'H') {
        var start = c;
        while (c < W && grid[r][c] === 'H') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(HELM_CLS) + '">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'B') {
        var start = c;
        while (c < W && grid[r][c] === 'B') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(BRIM_CLS) + '">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'L') {
        // Helmet light
        var start = c;
        while (c < W && grid[r][c] === 'L') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="hlight">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'V') {
        var start = c;
        while (c < W && grid[r][c] === 'V') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="visor">' + pick(CHAR_LIGHT) + '</span>';
        }
      } else if (ch === 'E') {
        // Glasses
        var start = c;
        while (c < W && grid[r][c] === 'E') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="glasses">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'F') {
        // Face
        var start = c;
        while (c < W && grid[r][c] === 'F') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(FACE_CLS) + '">' + pick(CHAR_MED) + '</span>';
        }
      } else if (ch === 'n') {
        // Neck
        var start = c;
        while (c < W && grid[r][c] === 'n') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="neck0">' + pick(CHAR_MED) + '</span>';
        }
      } else if (ch === 'K') {
        // Turnout coat
        var start = c;
        while (c < W && grid[r][c] === 'K') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(COAT_CLS) + '">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'S') {
        // Reflective stripe
        var start = c;
        while (c < W && grid[r][c] === 'S') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="stripe">' + pick(CHAR_LIGHT) + '</span>';
        }
      } else if (ch === 'G') {
        // Gear / dark equipment
        var start = c;
        while (c < W && grid[r][c] === 'G') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(GEAR_CLS) + '">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'f') {
        var start = c;
        while (c < W && grid[r][c] === 'f') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="fire">' + pick(FIRE_CHARS) + '</span>';
        }
      } else if (ch === 'N') {
        var start = c;
        while (c < W && grid[r][c] === 'N') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(NEEDLE_CLASSES) + '">' + pick(NEEDLE_CHARS) + '</span>';
        }
      } else if (ch === 'T') {
        var start = c;
        while (c < W && grid[r][c] === 'T') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(TRUNK_CLASSES) + '">' + pick(TRUNK_CHARS) + '</span>';
        }
      } else {
        if (isGround) {
          html += (Math.random() < 0.4) ?
            '<span class="gnd">' + pick(GROUND_CHARS) + '</span>' :
            '<span class="gnd"> </span>';
        } else {
          var t = r / totalRows;
          var skyDensity = 0.15 + t * 0.5;
          if (Math.random() < skyDensity) {
            var skyChar = (t > 0.6) ? pick(SKY_DENSE) : pick(SKY_CHARS);
            html += '<span class="' + cls + '">' + skyChar + '</span>';
          } else {
            html += '<span class="' + cls + '"> </span>';
          }
        }
        c++;
      }
    }

    div.innerHTML = html;
    el.appendChild(div);
  }
}

buildScene();

/* ============================================================
   FLASHLIGHT BEAM — ASCII characters sweeping left/right
   Renders into #beam-layer as a cone of bright chars.
   ============================================================ */
var beamLayer = document.getElementById('beam-layer');
var BEAM_CHARS = ['.','*',':','+','=','~','-'];
var BEAM_CLS = ['bm0','bm1','bm2','bm3','bm4','bm5'];

// Scene dimensions (recalculate to match buildScene)
var beamFontSize = 7;
var beamLineH = beamFontSize * 1.05;
var beamCharW = beamFontSize * 0.6;
var beamCols = Math.ceil(window.innerWidth / beamCharW) + 10;
var beamRows = Math.ceil(window.innerHeight / beamLineH) + 5;

var beamAngle = 0;
var beamDir = 1;
var beamSpeed = 0.04;
var beamMaxAngle = 1.2; // wide sweep across entire screen

// Origin of beam — helmet light position (matches buildCharacter)
var beamOriginRow = Math.floor(beamRows * 0.42) - 22 + 6 - 1; // helmetCY
var beamOriginCol = Math.floor(beamCols / 2);

function renderBeam() {
  beamAngle += beamSpeed * beamDir;
  if (beamAngle > beamMaxAngle) { beamAngle = beamMaxAngle; beamDir = -1; }
  if (beamAngle < -beamMaxAngle) { beamAngle = -beamMaxAngle; beamDir = 1; }

  // Build a 2D array for the beam cone
  var spread = 0.45; // half-angle of cone — wide beam
  var angle = beamAngle; // 0 = straight down, negative = left, positive = right
  var beamLen = beamRows; // max reach in rows (beam goes downward)

  var lines = [];
  for (var r = 0; r < beamRows; r++) {
    var row = '';
    for (var c = 0; c < beamCols; c++) {
      var dr = r - beamOriginRow;
      var dc = (c - beamOriginCol) * 0.5; // compress horizontal (chars are narrower than tall)
      var dist = Math.sqrt(dr * dr + dc * dc);

      if (dist < 3 || dr < 2) { row += ' '; continue; } // skip origin + above

      // Angle from origin to this cell — atan2(dc, dr) so 0 = straight down
      var cellAngle = Math.atan2(dc, dr);

      // Check if inside beam cone
      var diff = Math.abs(cellAngle - angle);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;

      if (diff < spread && dist < beamLen) {
        // Inside beam — brightness fades with distance and angle offset
        var distT = dist / beamLen;
        var angleT = diff / spread;
        var brightness = (1 - distT) * (1 - angleT * angleT);

        if (brightness > 0.01 && Math.random() < brightness * 1.2) {
          var clsIdx = Math.min(Math.floor((1 - brightness) * BEAM_CLS.length), BEAM_CLS.length - 1);
          row += '<span class="' + BEAM_CLS[clsIdx] + '">' + pick(BEAM_CHARS) + '</span>';
        } else {
          row += ' ';
        }
      } else {
        row += ' ';
      }
    }
    lines.push('<div>' + row + '</div>');
  }

  beamLayer.innerHTML = lines.join('');
  setTimeout(renderBeam, 80);
}

renderBeam();

/* Animate fire tips */
function animateFire() {
  var cells = document.querySelectorAll('.fire');
  for (var i = 0; i < cells.length; i++) {
    var s = cells[i];
    s.textContent = pick(FIRE_CHARS);
    s.className = 'fire ' + pick(FIRE_COLORS);
  }
  setTimeout(animateFire, 150);
}
animateFire();

/* Clock */
function updateInfo() {
  var now = new Date();
  var h = String(now.getUTCHours()).padStart(2, '0');
  var m = String(now.getUTCMinutes()).padStart(2, '0');
  var s = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('info-time').textContent = h + ':' + m + ':' + s + 'Z';

  var days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('info-date').textContent =
    days[now.getUTCDay()] + ' ' +
    String(now.getUTCDate()).padStart(2,'0') + ' ' +
    months[now.getUTCMonth()] + ' ' +
    now.getUTCFullYear();

  document.getElementById('info-loc').textContent = 'PLEASANTON, CA';
}

/* Boot */
var bootOrder = ['b-art', 'b-header', 'b-menu', 'b-info', 'b-bottom'];
var bootDelay = 200;

document.fonts.ready.then(function() {
  bootOrder.forEach(function(id, i) {
    setTimeout(function() {
      document.getElementById(id).classList.add('visible');
    }, i * bootDelay);
  });

  setTimeout(function() {
    updateInfo();
    setInterval(updateInfo, 1000);
    connectLandingWS();
  }, bootOrder.length * bootDelay + 200);
});

var lws = null;
var lwsCallbacks = {};

function sendCmd(cmd, cb) {
  if (!lws || lws.readyState !== 1) {
    cb(null, 'NOT CONNECTED');
    return;
  }
  lwsCallbacks[cmd] = cb;
  lws.send(JSON.stringify({cmd: cmd}));
}

function pollStatus() {
  sendCmd('PING SERVER', function(data, err) {
    document.getElementById('info-status').textContent = err ? 'OFFLINE' : data.result;
  });
  sendCmd('COUNT DISH', function(data, err) {
    var n = (data && data.result !== undefined) ? data.result : 0;
    document.getElementById('info-dishes').textContent = n + ' ONLINE';
  });
  sendCmd('COUNT DEVICE', function(data, err) {
    var n = (data && data.result !== undefined) ? data.result : 0;
    document.getElementById('info-devices').textContent = n + ' DETECTED';
  });
}

function connectLandingWS() {
  lws = new WebSocket('ws://localhost:5005');
  lws.onopen = function() {
    lws.send(JSON.stringify({data: 'connect', id: 'LANDING-' + Date.now()}));
  };
  lws.onmessage = function(e) {
    try {
      var data = JSON.parse(e.data);
      if (data.response === 'CONNECTED') {
        pollStatus();
        setInterval(pollStatus, 3000);
        return;
      }
      if (data.cmd && lwsCallbacks[data.cmd]) {
        lwsCallbacks[data.cmd](data, null);
        delete lwsCallbacks[data.cmd];
      }
    } catch(err) {}
  };
  lws.onclose = function() {
    lws = null;
    document.getElementById('info-status').textContent = 'OFFLINE';
    document.getElementById('info-dishes').textContent = '--';
    document.getElementById('info-devices').textContent = '--';
    setTimeout(connectLandingWS, 3000);
  };
  lws.onerror = function() { lws.close(); };
}

/* Keyboard navigation */
var menuItems = document.querySelectorAll('.menu-item');
var menuIdx = 0;

function setActiveMenu(idx) {
  menuItems.forEach(function(item) { item.classList.remove('active'); });
  menuIdx = idx;
  menuItems[menuIdx].classList.add('active');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setActiveMenu(Math.min(menuIdx + 1, menuItems.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setActiveMenu(Math.max(menuIdx - 1, 0));
  } else if (e.key === 'Enter') {
    menuItems[menuIdx].click();
  }
});

</script>
</body>
</html>
