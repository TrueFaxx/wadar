<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WADAR // SEARCH & RESCUE</title>
<link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
</head>
<body>
<div class="crt">

<div class="landing">
  <!-- ASCII SCENE — full background layer -->
  <div class="scene-bg boot-fade" id="b-art">
    <div class="ascii-scene" id="ascii-scene"></div>
  </div>

  <div class="header boot-fade" id="b-header">
    <div class="title">WADAR</div>
    <div class="subtitle">Search &amp; Rescue Triangulation System</div>
  </div>

  <div class="main">
    <div class="menu-left boot-fade" id="b-menu">
      <a class="menu-item active" href="/wadar">View WADAR</a>
      <a class="menu-item" href="#">Settings</a>
      <a class="menu-item" href="#">Developer Config</a>
    </div>

    <div style="flex:1"></div>

    <div class="panel-right boot-fade" id="b-info">
      <div class="info-panel">
        <div class="info-panel-title">Event Information</div>
        <div class="info-row">
          <span class="label">Date</span>
          <span class="value" id="info-date">--</span>
        </div>
        <div class="info-row">
          <span class="label">Time</span>
          <span class="value" id="info-time">--:--:--Z</span>
        </div>
        <div class="info-row">
          <span class="label">Location</span>
          <span class="value" id="info-loc">--</span>
        </div>
        <div class="info-row">
          <span class="label">Coords</span>
          <span class="value">37.6879&deg;N</span>
        </div>
        <div class="info-row">
          <span class="label"></span>
          <span class="value">121.8867&deg;W</span>
        </div>
        <div class="info-row" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #333;">
          <span class="label">Status</span>
          <span class="value" id="info-status">STANDBY</span>
        </div>
        <div class="info-row">
          <span class="label">Dishes</span>
          <span class="value">2 ONLINE</span>
        </div>
        <div class="info-row">
          <span class="label">Devices</span>
          <span class="value" id="info-devices">--</span>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar boot-fade" id="b-bottom">
    <div>
      <span class="action"><span class="key">ENTER</span> Select</span>
      <span class="action"><span class="key">ESC</span> Back</span>
    </div>
    <div>WADAR v2.1 // ZOHO OFFICE, PLEASANTON CA</div>
  </div>
</div>

</div>

<script>
/* ============================================================
   FOREST SCENE — individual pine trees placed across viewport
   Each tree is a triangle of foliage on a thick trunk.
   ============================================================ */
var FIRE_CHARS     = ['^','*','~','"',"'",'`','.'];
var FIRE_COLORS    = ['fc0','fc1','fc2','fc3','fc4'];
var NEEDLE_CHARS   = ['{','}','(',')','/','\\','^','*','%','&','#'];
var NEEDLE_CLASSES = ['n0','n1','n2','n3','n4','n5'];
var TRUNK_CHARS    = ['|','H','#','|','|','|','I','|'];
var TRUNK_CLASSES  = ['t0','t1','t2','t3','t4'];
var GROUND_CHARS   = ['.','.',',',',','_','.','`',"'"];
var SKY_CHARS    = ['.','.',':',':','-','~','`',"'",' ',' ',' '];
var SKY_DENSE    = ['.',':',';','-','~','=','+','*'];
var SKY_CLASSES  = ['sky0','sky1','sky2','sky3','sky4','sky5','sky6','sky7','sky8','sky9','sky10','sky11','sky12','sky13','sky14'];
var CHAR_DENSE   = ['@','#','M','W','N','%','&','$','8','B','D'];
var CHAR_MED     = ['=','+','*','x','o','k','d'];
var CHAR_LIGHT   = [':',';','.','~','-'];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function skyClass(row, totalRows) {
  var t = row / totalRows;
  var idx = Math.floor(t * SKY_CLASSES.length);
  if (idx >= SKY_CLASSES.length) idx = SKY_CLASSES.length - 1;
  return SKY_CLASSES[idx];
}

/* ============================================================
   FIREFIGHTER CHARACTER — 3 shapes: helmet, head, body
   All defined as ellipses with center, radii, and row range.
   Painted onto grid after trees. Body extends off-screen bottom.
   ============================================================ */
function buildCharacter(W, totalRows, grid) {
  var cx = Math.floor(W / 2); // center x

  // --- BODY (shoulders) — wide, extends off bottom ---
  // Trapezoid: narrow at neck, widens to shoulders, goes off screen
  var bodyTopRow = Math.floor(totalRows * 0.58);
  var bodyNeckW = 18; // half-width at neck
  var bodyShoulderW = 65; // half-width at full shoulder
  var bodyWidenRows = 25; // rows to go from neck to full width

  for (var r = bodyTopRow; r < totalRows; r++) {
    var rowInBody = r - bodyTopRow;
    var t = Math.min(rowInBody / bodyWidenRows, 1);
    // Ease out for natural shoulder curve
    var ease = 1 - (1 - t) * (1 - t);
    var halfW = Math.floor(bodyNeckW + (bodyShoulderW - bodyNeckW) * ease);

    for (var dc = -halfW; dc <= halfW; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        // Slight edge fade
        var edgeDist = Math.abs(dc) / halfW;
        if (edgeDist < 0.95 || Math.random() < 0.6) {
          grid[r][col] = 'C'; // character
        }
      }
    }
  }

  // --- HEAD — large oval ---
  var headCY = Math.floor(totalRows * 0.42);
  var headRX = 28; // horizontal radius
  var headRY = 22; // vertical radius

  for (var r = headCY - headRY; r <= headCY + headRY; r++) {
    if (r < 0 || r >= totalRows) continue;
    var dy = (r - headCY) / headRY;
    var xExtent = Math.floor(headRX * Math.sqrt(Math.max(0, 1 - dy * dy)));

    for (var dc = -xExtent; dc <= xExtent; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        var edgeDist = Math.abs(dc) / (xExtent || 1);
        if (edgeDist < 0.92 || Math.random() < 0.5) {
          grid[r][col] = 'C';
        }
      }
    }
  }

  // --- NECK connecting head to body ---
  var neckTop = headCY + headRY - 3;
  var neckBot = bodyTopRow + 2;
  var neckHalfW = 12;
  for (var r = neckTop; r <= neckBot; r++) {
    if (r < 0 || r >= totalRows) continue;
    for (var dc = -neckHalfW; dc <= neckHalfW; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'C';
      }
    }
  }

  // --- HELMET — wider flat oval sitting on top of head ---
  var helmetCY = headCY - headRY + 6; // overlaps top of head
  var helmetRX = 36; // wider than head
  var helmetRY = 10; // flatter

  for (var r = helmetCY - helmetRY; r <= helmetCY + helmetRY; r++) {
    if (r < 0 || r >= totalRows) continue;
    var dy = (r - helmetCY) / helmetRY;
    var xExtent = Math.floor(helmetRX * Math.sqrt(Math.max(0, 1 - dy * dy)));

    // Flatten the bottom — make helmet brim wider at bottom half
    if (dy > 0) {
      xExtent = Math.floor(xExtent * 1.15);
    }

    for (var dc = -xExtent; dc <= xExtent; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'H'; // helmet (denser fill)
      }
    }
  }

  // --- HELMET BRIM — a thin wide band at the bottom of helmet ---
  var brimRow = helmetCY + helmetRY - 2;
  var brimHalfW = Math.floor(helmetRX * 1.2);
  for (var dr = 0; dr < 3; dr++) {
    var r = brimRow + dr;
    if (r < 0 || r >= totalRows) continue;
    // Brim tapers slightly
    var w = brimHalfW - dr * 3;
    for (var dc = -w; dc <= w; dc++) {
      var col = cx + dc;
      if (col >= 0 && col < W) {
        grid[r][col] = 'H';
      }
    }
  }

  // --- VISOR LINE — horizontal detail across helmet ---
  var visorRow = helmetCY + 2;
  var visorHalfW = Math.floor(helmetRX * 0.7);
  for (var dr = 0; dr < 2; dr++) {
    var r = visorRow + dr;
    if (r >= 0 && r < totalRows) {
      for (var dc = -visorHalfW; dc <= visorHalfW; dc++) {
        var col = cx + dc;
        if (col >= 0 && col < W) {
          grid[r][col] = 'V'; // visor detail
        }
      }
    }
  }
}

function buildScene() {
  var el = document.getElementById('ascii-scene');
  el.innerHTML = '';

  var fontSize = 7;
  var lineHeight = fontSize * 1.05;
  var charWidth = fontSize * 0.6;
  var W = Math.ceil(window.innerWidth / charWidth) + 10;
  var totalRows = Math.ceil(window.innerHeight / lineHeight) + 5;

  // Generate individual trees with varied sizes and positions
  // Each tree: { x: center col, topRow: where tip starts, height: total rows, trunkWidth: 2-4 }
  var trees = [];
  var numTrees = Math.floor(W / 8) + 5;
  for (var i = 0; i < numTrees; i++) {
    var x = Math.floor(Math.random() * W);
    // Vary tree height — taller trees reach higher on screen
    var h = Math.floor(Math.random() * 38) + 30; // 30-68 rows tall
    var canopyH = Math.floor(h * 0.7);
    var trunkH = h - canopyH;
    var trunkW = Math.floor(Math.random() * 2) + 3; // 3-5 chars wide
    // Bottom of tree sits in the lower portion of the screen
    var bottomRow = totalRows - Math.floor(Math.random() * 6) - 2;
    var topRow = bottomRow - h;
    // Max canopy width at base of canopy (widest point)
    var maxCanopyW = Math.floor(canopyH * 0.8) + 5;

    trees.push({
      x: x,
      topRow: topRow,
      canopyH: canopyH,
      trunkH: trunkH,
      trunkW: trunkW,
      maxCanopyW: maxCanopyW,
      bottomRow: bottomRow
    });
  }

  trees.sort(function(a, b) { return a.topRow - b.topRow; });

  // Build full grid first so character can overlay trees
  var grid = [];
  for (var r = 0; r < totalRows; r++) {
    grid[r] = new Array(W);
    for (var c = 0; c < W; c++) grid[r][c] = null;
  }

  // Paint trees onto grid
  for (var r = 0; r < totalRows; r++) {
    for (var ti = 0; ti < trees.length; ti++) {
      var t = trees[ti];
      if (r < t.topRow || r > t.bottomRow) continue;

      var rowInTree = r - t.topRow;

      if (rowInTree < t.canopyH) {
        var progress = rowInTree / t.canopyH;
        var layerWave = Math.sin(rowInTree * 1.2) * 1.5;
        var halfW = Math.floor((progress * t.maxCanopyW) / 2 + layerWave);
        if (halfW < 1) halfW = 1;

        // Top 3 rows of each tree = fire tip
        var isTip = rowInTree < 3;

        for (var dc = -halfW; dc <= halfW; dc++) {
          var col = t.x + dc;
          if (col >= 0 && col < W) {
            var edgeDist = halfW > 0 ? Math.abs(dc) / halfW : 0;
            var density = 0.9 - edgeDist * 0.5;
            if (Math.random() < density) {
              grid[r][col] = isTip ? 'F' : 'N';
            }
          }
        }
      } else {
        // Trunk zone — thick vertical trunk
        var halfT = Math.floor(t.trunkW / 2);
        for (var dc = -halfT; dc <= halfT; dc++) {
          var col = t.x + dc;
          if (col >= 0 && col < W) {
            grid[r][col] = 'T'; // trunk
          }
        }
      }
    }

  } // end tree row loop

  // Paint firefighter character on top of trees
  buildCharacter(W, totalRows, grid);

  // Render grid to HTML
  for (var r = 0; r < totalRows; r++) {
    var div = document.createElement('div');
    var isGround = r >= totalRows - 6;
    var cls = isGround ? 'gnd' : skyClass(r, totalRows);

    var html = '';
    var c = 0;
    while (c < W) {
      var ch = grid[r][c];
      if (ch === 'H') {
        // Helmet — densest fill
        var start = c;
        while (c < W && grid[r][c] === 'H') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="char-h">' + pick(CHAR_DENSE) + '</span>';
        }
      } else if (ch === 'V') {
        // Visor detail line
        var start = c;
        while (c < W && grid[r][c] === 'V') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="char-v">' + pick(CHAR_LIGHT) + '</span>';
        }
      } else if (ch === 'C') {
        // Body/head — dark silhouette
        var start = c;
        while (c < W && grid[r][c] === 'C') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="char-b">' + ((Math.random() > 0.25) ? pick(CHAR_DENSE) : pick(CHAR_MED)) + '</span>';
        }
      } else if (ch === 'F') {
        var start = c;
        while (c < W && grid[r][c] === 'F') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="fire">' + pick(FIRE_CHARS) + '</span>';
        }
      } else if (ch === 'N') {
        var start = c;
        while (c < W && grid[r][c] === 'N') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(NEEDLE_CLASSES) + '">' + pick(NEEDLE_CHARS) + '</span>';
        }
      } else if (ch === 'T') {
        var start = c;
        while (c < W && grid[r][c] === 'T') c++;
        for (var j = 0; j < c - start; j++) {
          html += '<span class="' + pick(TRUNK_CLASSES) + '">' + pick(TRUNK_CHARS) + '</span>';
        }
      } else {
        if (isGround) {
          html += (Math.random() < 0.4) ?
            '<span class="gnd">' + pick(GROUND_CHARS) + '</span>' :
            '<span class="gnd"> </span>';
        } else {
          var t = r / totalRows;
          var skyDensity = 0.15 + t * 0.5;
          if (Math.random() < skyDensity) {
            var skyChar = (t > 0.6) ? pick(SKY_DENSE) : pick(SKY_CHARS);
            html += '<span class="' + cls + '">' + skyChar + '</span>';
          } else {
            html += '<span class="' + cls + '"> </span>';
          }
        }
        c++;
      }
    }

    div.innerHTML = html;
    el.appendChild(div);
  }
}

buildScene();

/* Animate fire tips */
function animateFire() {
  var cells = document.querySelectorAll('.fire');
  for (var i = 0; i < cells.length; i++) {
    var s = cells[i];
    s.textContent = pick(FIRE_CHARS);
    s.className = 'fire ' + pick(FIRE_COLORS);
  }
  setTimeout(animateFire, 150);
}
animateFire();

/* Clock */
function updateInfo() {
  var now = new Date();
  var h = String(now.getUTCHours()).padStart(2, '0');
  var m = String(now.getUTCMinutes()).padStart(2, '0');
  var s = String(now.getUTCSeconds()).padStart(2, '0');
  document.getElementById('info-time').textContent = h + ':' + m + ':' + s + 'Z';

  var days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('info-date').textContent =
    days[now.getUTCDay()] + ' ' +
    String(now.getUTCDate()).padStart(2,'0') + ' ' +
    months[now.getUTCMonth()] + ' ' +
    now.getUTCFullYear();

  document.getElementById('info-loc').textContent = 'PLEASANTON, CA';
}

/* Boot */
var bootOrder = ['b-art', 'b-header', 'b-menu', 'b-info', 'b-bottom'];
var bootDelay = 200;

document.fonts.ready.then(function() {
  bootOrder.forEach(function(id, i) {
    setTimeout(function() {
      document.getElementById(id).classList.add('visible');
    }, i * bootDelay);
  });

  setTimeout(function() {
    updateInfo();
    setInterval(updateInfo, 1000);
    document.getElementById('info-status').textContent = 'OPERATIONAL';
    document.getElementById('info-devices').textContent = '3 DETECTED';
  }, bootOrder.length * bootDelay + 200);
});

/* Keyboard navigation */
var menuItems = document.querySelectorAll('.menu-item');
var menuIdx = 0;

function setActiveMenu(idx) {
  menuItems.forEach(function(item) { item.classList.remove('active'); });
  menuIdx = idx;
  menuItems[menuIdx].classList.add('active');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setActiveMenu(Math.min(menuIdx + 1, menuItems.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setActiveMenu(Math.max(menuIdx - 1, 0));
  } else if (e.key === 'Enter') {
    menuItems[menuIdx].click();
  }
});

</script>
</body>
</html>
